spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/event_registration}
    username: ${DB_USERNAME:event}
    password: ${DB_PASSWORD:event123}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# --- App-specific config ---
app:
  upload:
    dir: ${UPLOAD_DIR:uploads/thumbnails}
    base-url: /api/uploads/thumbnails/

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html