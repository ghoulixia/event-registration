services:
  postgres:
    image: postgres:16
    container_name: event-registration-postgres
    environment:
      POSTGRES_DB: event_registration
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event123
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event -d event_registration"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/event_registration
      DB_USERNAME: event
      DB_PASSWORD: ${DB_PASSWORD:-event123}
      JWT_SECRET: ${JWT_SECRET:?Set a private base64 32-byte JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      UPLOAD_DIR: /app/uploads/thumbnails
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  postgres_data:
  backend_uploads: